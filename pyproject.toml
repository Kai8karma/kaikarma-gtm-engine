[project]
name = "kaikarma-gtm-engine"
version = "0.1.0"
description = "Air-gapped GTM engine — deterministic, explainable, stdlib-only modules for ICP scoring, ABM sequencing, paid-channel control, and RevOps automation."
authors = [{ name = "Kai", email = "kai8karma@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"

# Core has ZERO runtime dependencies (stdlib-only, air-gapped). These extras are
# needed ONLY to run a LIVE executor against a real account — the brain stays
# offline; only an Executor egresses. See docs/egress-policy.md.
[project.optional-dependencies]
google = ["google-ads"]        # GoogleAdsExecutor backend (Apache-2.0)
meta = ["facebook-business"]   # MetaAdsExecutor backend
linkedin = ["requests"]        # LinkedInAdsExecutor HTTP client
hubspot = ["hubspot-api-client"]  # HubSpot CRM adapter backend
apollo = ["requests"]          # Apollo enrichment (REST)
instantly = ["requests"]       # email sequencer (REST)

[tool.pytest.ini_options]
pythonpath = [
    "01-list-engine",
    "02-send-engine",
    "03-abm-paid-engine",
    "04-revops-engine",
    "05-brain-integration",
    "examples",
    "engagements/_TEMPLATE",
    "evals",
]
testpaths = [
    "01-list-engine",
    "02-send-engine",
    "03-abm-paid-engine",
    "04-revops-engine",
    "05-brain-integration",
    "examples",
    "engagements/_TEMPLATE",
    "evals",
]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
