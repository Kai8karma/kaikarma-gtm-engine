[project]
name = "kaikarma-gtm-engine"
version = "0.1.0"
description = "Air-gapped GTM engine — deterministic, explainable, stdlib-only modules for ICP scoring, ABM sequencing, paid-channel control, and RevOps automation."
authors = [{ name = "Kai", email = "kai8karma@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [
    "01-list-engine",
    "02-send-engine",
    "03-abm-paid-engine",
    "04-revops-engine",
    "05-brain-integration",
    "examples",
    "engagements/_TEMPLATE",
]
testpaths = [
    "01-list-engine",
    "02-send-engine",
    "03-abm-paid-engine",
    "04-revops-engine",
    "05-brain-integration",
    "examples",
    "engagements/_TEMPLATE",
]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
